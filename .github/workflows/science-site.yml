name: ClassKernel Science website

# Publishes ClassKernel Science (apps/science), the science teaching tools, as
# a website on GitHub Pages from main. ClassKernel's Science button opens it at
# this address (apps/classkernel/src/lib/science.ts). It needs Pages switched
# on once: repository Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @classkernel/ui -w classkernel-science
      - run: npm run build -w classkernel-science
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/science/dist
      - id: deployment
        uses: actions/deploy-pages@v4
