name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Work out the version to build
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release build is whatever the tag says.
            version="${GITHUB_REF#refs/tags/v}"
          else
            # Every other build keeps the major.minor from the repo and takes the
            # run number as its patch, so each one is a distinct, rising version.
            version="${base%.*}.${GITHUB_RUN_NUMBER}"
          fi
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ClassKernel $version"
      - name: Build Tauri app
        run: npx tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: classkernel-${{ steps.version.outputs.version }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
