[package]
name = "classkernel"
version = "0.1.0"
description = "Fast, offline-first classroom management for teachers"
edition = "2021"

[lib]
name = "classkernel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Science window's own taskbar identity (src/windows_app.rs). The same
# version Tauri itself uses, so it isn't built twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
